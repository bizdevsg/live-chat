<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolidChat Assistant</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <strong>SolidChat AI</strong>
        <span id="connectionBadge" class="badge">Menghubungkan…</span>
      </div>
    </header>

    <section class="chat-context">
      <div>
        <span class="eyebrow">CHAT AKTIF</span>
        <strong id="chatTitle">Buka WhatsApp Web</strong>
      </div>
      <span id="messageCount" class="count">0 pesan</span>
    </section>

    <section class="auto-card">
      <div>
        <strong>Auto Reply</strong>
        <p>Hanya chat aktif dan hanya jika lolos pemeriksaan keamanan.</p>
      </div>
      <label class="switch" aria-label="Aktifkan auto reply">
        <input id="autoReplyToggle" type="checkbox" />
        <span></span>
      </label>
    </section>
    <p id="autoStatus" class="status-line">Auto-reply nonaktif.</p>

    <main id="assistantMessages" class="assistant-messages" aria-live="polite">
      <article class="message assistant">
        <p>Saya otomatis membaca chat WhatsApp yang sedang dibuka. Beri instruksi untuk menyusun jawaban berdasarkan knowledge base.</p>
      </article>
    </main>

    <section class="quick-prompts" aria-label="Prompt cepat">
      <button type="button" data-prompt="Buat jawaban yang singkat, ramah, dan profesional.">Jawaban singkat</button>
      <button type="button" data-prompt="Buat jawaban yang lebih empatik dan menenangkan customer.">Lebih empatik</button>
      <button type="button" data-prompt="Jelaskan langkah-langkahnya dengan sederhana dan mudah dipahami.">Jelaskan langkah</button>
    </section>

    <footer class="composer">
      <textarea id="promptInput" rows="2" placeholder="Contoh: Bantu bikin jawaban untuk ini…"></textarea>
      <button id="askButton" class="send-button" type="button" aria-label="Kirim prompt">↑</button>
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
