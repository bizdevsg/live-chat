name: solidchat_flutter
description: Ready-to-use native Flutter customer support chat UI for SolidChat.
version: 0.17.0
repository: https://github.com/bizdevsg/live-chat
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon-header.png
    - assets/conversation-bg.png
