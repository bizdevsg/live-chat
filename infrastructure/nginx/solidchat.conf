# Local/dev HTTP reverse proxy — mirrors the production subdomain topology (§42) so the
# same nginx config shape works in both environments. For local testing without real DNS,
# map these hostnames to 127.0.0.1 in /etc/hosts (or Windows hosts file):
#   127.0.0.1 chat.local api-chat.local cs-chat.local
# Otherwise, just hit the mapped container ports directly (dashboard:3000, api:4000, widget:3001).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone $binary_remote_addr zone=solidchat_general:10m rate=20r/s;

# ── chat.local — widget iframe app + widget.js loader ───────────────────────
server {
    listen 80;
    server_name chat.local;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "" always; # widget is designed to be framed by the parent site
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=solidchat_general burst=40 nodelay;
        proxy_pass http://widget:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── api-chat.local — NestJS API + Socket.IO ─────────────────────────────────
server {
    listen 80;
    server_name api-chat.local;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=solidchat_general burst=40 nodelay;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── cs-chat.local — Admin/CS dashboard ──────────────────────────────────────
server {
    listen 80 default_server;
    server_name cs-chat.local _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
